<!DOCTYPE html>
<html>

<head>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
</head>

<body>
    <div id="account-header" style="background: #f1f4f8; padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #d1d1d1; font-family: sans-serif;">
    <div style="font-size: 12px; color: #457b9d; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70%;">
        Logged in: <span id="user-display-email" style="font-weight: bold;">...</span>
    </div>
    <button id="header-logout-btn" style="background: #e63946; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: bold; cursor: pointer;">
        LOGOUT
    </button>
    </div>
    
    <div id="auth-overlay" style="position:fixed; top:0; left:0; width:100%; height:100%; background:white; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center;">
        <h2 style="color:#1d3557;">Speech Tracker</h2>
        <input type="email" id="auth-email" placeholder="Email" style="padding:12px; margin:10px; width:80%; max-width:350px; border:1px solid #ccc; border-radius:8px;">
        <input type="password" id="auth-password" placeholder="Password" style="padding:12px; margin:10px; width:80%; max-width:350px; border:1px solid #ccc; border-radius:8px;">
        <button id="login-btn" class="save-btn" style="width:80%; max-width:350px; margin-top:10px;">Login</button>
        <button id="signup-btn" 
            style="width:80%; max-width:350px; margin-top:15px; padding: 10px; border: 1px solid #1d3557; background: white; color: #1d3557; border-radius: 8px; font-size: 14px; cursor: pointer;">
            Create New Account
        </button>    
    
    </div>
    
    <div class="container">
        <div class="nav-menu">
            <button id="nav-tracker" class="nav-btn active">Therapy Tracker</button>
            <button id="nav-dashboard" class="nav-btn">Client Progress</button>
        </div>

        <div id="tracker-view">
            <div class="session-info">
                <input type="text" id="client-name" placeholder="Client Name" autocomplete="off">

                <div class="target-grid">
                    <select id="speech-sound">
                        <option value="" disabled selected>Speech sound</option>
                        <optgroup label="Velar stops">
                            <option value="/k/">/k/</option>
                            <option value="/g/">/g/</option>
                        </optgroup>
                        <optgroup label="Fricatives">
                            <option value="/s/">/s/</option>
                            <option value="/z/">/z/</option>
                            <option value="/ʃ/">/ʃ/</option>
                            <option value="/θ/">/θ/</option>
                            <option value="/f/">/f/</option>
                            <option value="/v/">/v/</option>
                            <option value="/h/">/h/</option>
                        </optgroup>
                        <optgroup label="Affricates">
                            <option value="/tʃ/">/tʃ/</option>
                            <option value="/dʒ/">/dʒ/</option>
                        </optgroup>
                        <optgroup label="s-clusters">
                            <option value="/sp/">/sp/</option>
                            <option value="/st/">/st/</option>
                            <option value="/sk/">/sk/</option>
                            <option value="/sn/">/sn/</option>
                            <option value="/sm/">/sm/</option>
                            <option value="/sl/">/sl/</option>
                            <option value="/sw/">/sw/</option>
                            <option value="/s-blends/">s-blends</option>
                        </optgroup>
                        <optgroup label="Liquids">
                            <option value="/l/">/l/</option>
                            <option value="/r/">/r/</option>
                        </optgroup>
                    </select>

                    <select id="speech-position">
                        <option value="" disabled selected>Position</option>
                        <option value="Initial">initial</option>
                        <option value="Medial">medial</option>
                        <option value="Final">final</option>
                    </select>

                    <select id="speech-level" style="grid-column: span 2;">
                        <option value="Sound">Sound level</option>
                        <option value="Word">Word level</option>
                        <option value="Phrase">Phrase level</option>
                        <option value="Sentence">Sentence level</option>
                        <option value="Conversation">Conversation</option>
                    </select>
                </div>

                <div class="prompt-container">
                    <p class="label-text">Cues provided</p>
                    <div class="prompt-chips" id="prompt-chips">
                        <button type="button" class="chip" data-value="Indpt">Independent</button>
                        <button type="button" class="chip" data-value="Visual">Visual</button>
                        <button type="button" class="chip" data-value="Verbal">Verbal</button>
                        <button type="button" class="chip" data-value="Tactile">Tactile</button>
                        <button type="button" class="chip" data-value="Model">Modelling</button>
                    </div>
                </div>
            </div>
            <div class="tracker-main">
                <h1>Speech Tracker</h1>
                <div class="percentage">0%</div>

                <div class="button-row">
                    <div class="counter-group">
                        <button class="btn correct">✓</button>
                        <span id="correct-count">0</span>
                    </div>
                    <div class="counter-group">
                        <button class="btn incorrect">✕</button>
                        <span id="incorrect-count">0</span>
                    </div>
                </div>

                <div class="actions">
                    <button id="save-btn" class="save-btn">Save</button>
                    <button id="reset-btn" class="reset-link">Reset</button>
                </div>

                <div id="history-log" class="history-log"></div>
            </div>
        </div>

        <div id="dashboard-view" class="hidden">
            <div class="session-info">
                <h3>Client Progress Search</h3>
                <input type="text" id="search-client" placeholder="Type child's name (e.g. Leo)">
                <button id="download-csv" class="save-btn" style="margin-top: 10px; background-color: #72a788;">Download
                    CSV Report
                </button>
            </div>

            <div id="all-goals-container" style="margin: 20px 0;"></div>

            <div id="client-history-results">
                <p style="color: #7f8c8d; text-align: center; margin-top: 20px;">Search for a client to see their
                    progress history.
                </p>
            </div>

            <div style="text-align: center; margin-top: 40px; padding-bottom: 20px;">
                <button id="logout-btn" style="background: none; border: none; color: #e63946; text-decoration: underline; font-size: 14px; cursor: pointer;">
                Log Out of Account
                </button>
            </div>
        </div>
        <script src="script.js"></script>
</body>

</html>
